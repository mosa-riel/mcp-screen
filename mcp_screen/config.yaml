# Bridged (like the other MCPs) so it gets a readable internal DNS name — the agent
# reaches the MCP endpoint at http://local-mcp-screen:8788/mcp. The PNG host port is
# published to the host LAN via `ports` so the reTerminal can fetch /screen.png. The
# device's ESPHome API (:6053) is reached outbound by IP (bridged containers can't do
# mDNS) — set reterminal_host to the device's (reserved) IP, not its .local name.
name: MCP Screen (reTerminal e-paper)
version: "0.3.4"
slug: mcp_screen
description: Live Home Assistant dashboards on the reTerminal E1001 e-paper (render, host, push), over MCP for the reSpeaker agent
url: https://github.com/mosa-riel/mcp-screen
arch:
  - aarch64
  - amd64
init: true
# Read-only Home Assistant data for the dashboards (states, forecasts, todo items) through
# the Supervisor proxy; no long-lived token needed.
homeassistant_api: true
boot: auto
startup: services
ports:
  8799/tcp: 8799
ports_description:
  8799/tcp: PNG host the reTerminal e-paper fetches (point its online_image url here)
options:
  reterminal_host: 192.168.18.152
  screen_port: 8799
  mcp_port: 8788
  weather_entity: weather.forecast_home
  refresh_minutes: 15
  home_after_minutes: 60
schema:
  reterminal_host: str
  screen_port: port
  mcp_port: port
  weather_entity: str
  refresh_minutes: int(1,1440)
  home_after_minutes: int(0,1440)
